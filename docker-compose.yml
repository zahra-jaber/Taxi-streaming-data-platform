services:

  postgres:
    image: postgres:16
    container_name: taxi-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

  airflow-init:
    image: apache/airflow:2.10.5
    container_name: taxi-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW_UID: "${AIRFLOW_UID:-50000}"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        (airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true) &&
        (airflow dags unpause taxi_streaming_pipeline || true)

  airflow-webserver:
    image: apache/airflow:2.10.5
    container_name: taxi-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW_UID: "${AIRFLOW_UID:-50000}"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    image: apache/airflow:2.10.5
    container_name: taxi-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW_UID: "${AIRFLOW_UID:-50000}"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    command: scheduler

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: taxi-zookeeper

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: taxi-kafka

    depends_on:
      - zookeeper

    ports:
      - "9092:9092"
      - "29092:29092"

    environment:

      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT://kafka:29092,
        PLAINTEXT_HOST://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: taxi-schema-registry

    depends_on:
      - kafka

    ports:
      - "8081:8081"

    environment:

      SCHEMA_REGISTRY_HOST_NAME: schema-registry

      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: >
        PLAINTEXT://kafka:29092

      SCHEMA_REGISTRY_LISTENERS: >
        http://0.0.0.0:8081


  control-center:
    image: confluentinc/cp-enterprise-control-center:7.6.1
    container_name: taxi-control-center

    depends_on:
      - kafka
      - schema-registry

    ports:
      - "9021:9021"

    environment:

      CONTROL_CENTER_BOOTSTRAP_SERVERS: kafka:29092

      CONTROL_CENTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081

      CONTROL_CENTER_REPLICATION_FACTOR: 1

      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1

      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1

      CONTROL_CENTER_COMMAND_TOPIC_REPLICATION: 1

      CONFLUENT_METRICS_TOPIC_REPLICATION: 1

      PORT: 9021

  spark-checkpoints-init:
    image: apache/spark:3.5.6-python3
    container_name: taxi-spark-checkpoints-init
    user: "0:0"
    volumes:
      - spark_checkpoints:/opt/spark/checkpoints
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mkdir -p /opt/spark/checkpoints &&
        chown -R 185:185 /opt/spark/checkpoints &&
        chmod -R u+rwX /opt/spark/checkpoints
  

  cassandra:
    image: cassandra:5.0
    container_name: taxi-cassandra

    ports:
      - "9042:9042"

    environment:
      CASSANDRA_CLUSTER_NAME: TaxiCluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch

    volumes:
      - cassandra_data:/var/lib/cassandra

  spark-master:
    image: apache/spark:3.5.6-python3
    container_name: taxi-spark-master
    depends_on:
      spark-checkpoints-init:
        condition: service_completed_successfully
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8088:8080"
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - spark_checkpoints:/opt/spark/checkpoints
      - ./spark/ivy-cache:/home/spark/.ivy2

  spark-worker:
    image: apache/spark:3.5.6-python3
    container_name: taxi-spark-worker
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    ports:
      - "8089:8081"
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2G
    volumes:
      - ./spark/jobs:/opt/spark/jobs
      - spark_checkpoints:/opt/spark/checkpoints
      - ./spark/ivy-cache:/home/spark/.ivy2
      


volumes:
  cassandra_data:
  spark_checkpoints:
  spark-ivy-cache:
  airflow_postgres_data:
